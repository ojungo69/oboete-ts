title = "oboete secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic credential shapes required by redaction tests."
targetRules = ["generic-api-key", "gcp-api-key", "jwt"]
paths = [
  '''^(legacy/)?harness/phase1-no-agent-blockage\.mjs$''',
  '''^(legacy/)?vendor/codemem/packages/cli/src/commands/hook-thin-client\.test\.ts$''',
  '''^(legacy/)?vendor/codemem/packages/core/src/secret-scanner\.test\.ts$''',
  '''^(legacy/)?vendor/codemem/packages/core/src/sync-replication\.test\.ts$''',
]

# 除外は「ファイル」ではなく「その 1 件」に当てる。path だけで 3 ルールを外すと、
# 本物の GCP key や JWT をこのファイルへ貼っても検出されなくなる。
# 対象はこの branch の履歴に残る合成リテラル 1 つだけ（735eb90。現在の tree では
# 変数名を変えたので鳴らない）。squash merge 後の main には載らないので、そこで消せる。
[[allowlists]]
description = "One synthetic 20-char literal left in this branch history."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^(legacy/)?harness/evidence/secrets\.test\.ts$''']
regexes = ['''^0123456789abcdefghij$''']

# PR #335 の偽 account id（`{ id, secret }` の `secret:` キーで generic-api-key が鳴る）。
# merge commit で main の履歴に残るので、この path のこの値 1 件だけを外す。
[[allowlists]]
description = "One fake Cloudflare account id in the replay privacy-check test."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^test/unit/replay-evaluate\.test\.ts$''']
regexes = ['''^acct-0123456789abcdef$''']

# 合成シークレット corpus (T024)。secretlint が検出できる正しい形式である必要があるので、
# 値を崩して gitleaks を避けることはできない。path だけでなく、この corpus が実際に
# 鳴らす 16 ルールに限定して外す (他の型の本物の値はこのファイルでも検出される)。
[[allowlists]]
description = "Synthetic secret corpus for the redaction tests (test/corpus/secrets.jsonl)."
condition = "AND"
targetRules = [
  "gcp-api-key",
  "generic-api-key",
  "github-fine-grained-pat",
  "github-pat",
  "gitlab-pat",
  "grafana-service-account-token",
  "jwt",
  "notion-api-token",
  "npm-access-token",
  "openai-api-key",
  "private-key",
  "sendgrid-api-token",
  "slack-bot-token",
  "slack-webhook-url",
  "stripe-access-token",
  "vault-service-token",
]
paths = ['''^test/corpus/secrets\.jsonl$''']
