# DCO ゲートを CI 本体から分けて `pull_request_target` で走らせる。workflow も checker も base
# branch 側から読むため、PR は自分を検査するコードを変更できない。PR head は git object として
# 取得するだけで checkout も実行もしない（`pull_request_target` の危険はそこにある）。
# `dco` という check 名の生産者はここ 1 つに保つ。required status check は同じ名前の check run を
# 全件見るので、生産者が増えると、そちらが失敗・取り消しになるだけで merge が止まる。どの run が
# 判定したのかも辿れなくなる。理由と背景は CONTRIBUTING.md と legacy/evidence/adr-004-licensing.md に。
name: DCO

on:
  pull_request_target:
    branches: [main]
    # 既定は opened / synchronize / reopened だけ。別 branch 宛の PR を commit 追加なしで main へ
    # 付け替える操作は edited なので、これが無いと検査されない PR が main へ向く。
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# 同じ理由で concurrency も置かない。取り消された run は required check を満たさないので、1 つ
# 取り消されるだけで merge が止まる（PR #88 で実測: `dco` が [success, cancelled] になり BLOCKED）。
# `cancel-in-progress: false` でも、3 つめが来たときに待機中の run が取り消されるので同じ。
# run が重複する分の CI 時間より、ゲートが理由の分からない BLOCKED を出さないことを優先する。

jobs:
  dco:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out base branch
        # pull_request_target なので checkout されるのは base branch 側の tree。
        # ここで取れる scripts/dco-check.mjs が検査の正本になる。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - name: Fetch base branch and PR head
        # fork PR でも base repo に refs/pull/<N>/head があるので、同じ経路で取得できる。
        # ref 名は env から引用して渡し、workflow 式を shell script へ直接埋め込まない。
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
      - name: Verify DCO sign-offs
        # squash 後の main commit ではなく、PR の merge-base から head までを検査する。
        # head は event が渡した SHA を使う。fetch 後に force-push されて SHA が消えていれば
        # merge-base が失敗して exit 2 になる（fail-closed）。
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node scripts/dco-check.mjs "$BASE_REF" "$HEAD_REF"
